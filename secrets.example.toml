ALPACA_PAPER_API_KEY = ""
ALPACA_PAPER_SECRET_KEY = ""

# Optional: free live IEX data and delayed full-market historical SIP data.
ALPACA_LIVE_FEED = "iex"
ALPACA_HISTORICAL_FEED = "sip"
# General/deeper reasoning model (YouTube analysis, Rule Compiler, synthesis).
GEMINI_MODEL = "gemini-3.7-flash"
