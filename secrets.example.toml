# Trading Intelligence book pipeline roles.
# 3.6 handles normal bulk reading; 3.7 is called only for difficult/ambiguous sections.
GEMINI_BOOK_MODEL = "gemini-3.6-flash"
GEMINI_BOOK_SPECIALIST_MODEL = "gemini-3.7-flash"
GEMINI_BOOK_FALLBACK_MODEL = "gemini-3.5-flash"


# Permanent Trading Lab storage in the existing private GitHub backup repository.
GITHUB_BACKUP_REPOSITORY = "derektshaffer/derektshaffer-youtube-trading-strategy-lab"
GITHUB_BACKUP_BRANCH = "main"
GITHUB_BACKUP_PATH = "youtube-strategy-lab/strategy_library.json"
TRADING_INTELLIGENCE_BACKUP_PATH = "trading-intelligence-lab/intelligence_library.json"
# Fine-grained PAT with access to the private repo and Contents: Read and write.
GITHUB_BACKUP_TOKEN = "paste-your-private-github-backup-token-here"


# Immediate launcher for background/distributed GitHub Actions jobs.
# Use a dedicated fine-grained token for youtube-trading-strategy-lab-public
# with Actions: Read and write. Do not reuse the private backup token.
GITHUB_ACTIONS_TOKEN = ""
GITHUB_ACTIONS_REPOSITORY = "derektshaffer/youtube-trading-strategy-lab-public"
GITHUB_ACTIONS_REF = "main"

# GitHub Actions repository secrets are configured separately in GitHub:
# TRADING_LAB_BACKUP_REPOSITORY, TRADING_LAB_BACKUP_TOKEN,
# ALPACA_API_KEY, ALPACA_SECRET_KEY, and GEMINI_API_KEY.
