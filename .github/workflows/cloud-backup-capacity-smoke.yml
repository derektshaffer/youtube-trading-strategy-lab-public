name: Isolated cloud backup capacity and recovery
on:
  push:
    branches: [codex/cloud-backup-capacity-smoke]
permissions:
  contents: read
  actions: read
concurrency:
  group: isolated-cloud-backup-capacity-smoke
  cancel-in-progress: false
jobs:
  storage-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GITHUB_BACKUP_REPOSITORY: ${{ secrets.TRADING_LAB_BACKUP_REPOSITORY }}
      GITHUB_BACKUP_TOKEN: ${{ secrets.TRADING_LAB_BACKUP_TOKEN }}
      PRODUCTION_BACKUP_BRANCH: ${{ vars.GITHUB_BACKUP_BRANCH || 'main' }}
      PRODUCTION_BACKUP_PATH: ${{ vars.TRADING_INTELLIGENCE_BACKUP_PATH || 'trading-intelligence-lab/intelligence_library.json' }}
      RESEARCH_ACTIONS_TOKEN: ${{ github.token }}
      RESEARCH_RECOVERY_SMOKE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install storage test dependencies
        run: |
          python -m pip install -r requirements.txt requests pytest
          npm ci --prefix .github/recovery-artifact --ignore-scripts
      - name: Test storage and recovery units
        run: |
          python -m pytest -q test_cloud_library_codec.py test_cloud_backup_reconciliation.py test_hybrid_github_library.py test_hybrid_github_git_upload.py
          node --test .github/recovery-artifact/test.cjs
      - name: Configure isolated destination
        id: plan
        run: python cloud_backup_capacity_smoke.py configure
      - name: Measure production capacity read-only
        if: steps.plan.outputs.phase == 'retain'
        run: python cloud_backup_capacity_smoke.py capacity
      - name: Prepare private fixture exceeding 100 MiB logical size
        if: steps.plan.outputs.phase == 'retain'
        run: python cloud_backup_capacity_smoke.py prepare
      - name: Upload encrypted completed fixture and interrupt before sync
        if: steps.plan.outputs.phase == 'retain'
        id: interrupt
        continue-on-error: true
        uses: ./.github/recovery-artifact
      - name: Verify expected interruption and unchanged fixture
        if: steps.plan.outputs.phase == 'retain'
        env:
          INTERRUPT_OUTCOME: ${{ steps.interrupt.outcome }}
        run: |
          test "$INTERRUPT_OUTCOME" = failure
          python cloud_backup_capacity_smoke.py verify-retained
      - name: Recover prior-run artifact on a fresh runner and race two writers
        if: steps.plan.outputs.phase == 'recover'
        uses: ./.github/recovery-smoke
      - name: Upload aggregate evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capacity-recovery-smoke-evidence
          path: capacity-smoke-output/*.json
          if-no-files-found: ignore
          retention-days: 30
