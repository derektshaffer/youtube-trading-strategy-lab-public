name: Fix optimizer completion UI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-optimizer-completion-ui.yml"
      - ".github/scripts/fix_optimizer_completion_ui.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -r requirements.txt
      - name: Patch completion UI
        run: python .github/scripts/fix_optimizer_completion_ui.py
      - name: Verify
        run: |
          python -m py_compile youtube_strategy_app.py youtube_strategy_engine.py
          grep -F 'min(0.97' youtube_strategy_app.py
          grep -F 'results ready below' youtube_strategy_app.py
          python -m unittest -q test_youtube_strategy_engine.py
      - name: Commit fix
        run: |
          if git diff --quiet -- youtube_strategy_app.py; then
            echo "Completion UI fix already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add youtube_strategy_app.py
          git commit -m "Fix optimizer completion and result visibility"
          git push
