name: Apply expanded optimizer

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-expanded-optimizer.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install app dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Apply comprehensive optimizer patch
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          workflow = Path(".github/workflows/expand-optimizer-search.yml").read_text(encoding="utf-8")
          start_marker = "      - name: Expand optimizer and add full-window objective\n        shell: python\n        run: |\n"
          end_marker = "\n      - name: Verify syntax and optimizer features\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, "optimizer_patch", "exec"), {"__name__": "__main__"})

      - name: Verify optimizer upgrade
        run: |
          python -m py_compile youtube_strategy_engine.py youtube_strategy_app.py
          python - <<'PY'
          from pathlib import Path
          from youtube_strategy_engine import BacktestSettings, OptimizationSettings, generate_execution_variants, generate_strategy_variants

          settings = BacktestSettings(
              starting_cash=2000,
              risk_per_trade_pct=10,
              max_position_pct=100,
              default_stop_pct=2,
              default_reward_risk=2,
              spread_bps=12,
              slippage_bps=6,
          )
          opt = OptimizationSettings(
              max_variants_per_strategy=320,
              finalists_per_strategy=32,
              max_execution_variants_per_finalist=64,
              selection_mode="historical_pnl",
          )
          opt.validate()
          sample = {
              "id": "smoke",
              "name": "Smoke",
              "direction": "long",
              "machine_rules": {
                  "stop_loss_pct": None,
                  "reward_risk": None,
                  "min_relative_volume": 2.0,
                  "breakout_lookback_bars": 10,
              },
          }
          variants = generate_strategy_variants(sample, settings, maximum=320)
          assert any(
              abs(float(v.get("stop_loss_pct") or 0) - 4.2) < 1e-9
              and abs(float(v.get("reward_risk") or 0) - 2.0) < 1e-9
              for v in variants
          ), "4.2% stop / 2R manual-style candidate was not generated"
          executions = generate_execution_variants(settings, maximum=64)
          assert any(
              abs(v.risk_per_trade_pct - 10) < 1e-9
              and abs(v.max_position_pct - 100) < 1e-9
              for v in executions
          ), "10% risk / 100% position candidate was not generated"

          app = Path("youtube_strategy_app.py").read_text(encoding="utf-8")
          engine = Path("youtube_strategy_engine.py").read_text(encoding="utf-8")
          assert "Maximum historical P/L — search the full selected window" in app
          assert "Comprehensive — 240 combinations" in app
          assert "Exhaustive — 320 combinations" in app
          assert "selection_mode: str = \"validated\"" in engine
          assert "def _optimize_stock_strategies_historical(" in engine
          PY
          python -m unittest -q test_youtube_strategy_engine.py

      - name: Commit upgraded optimizer
        run: |
          if git diff --quiet -- youtube_strategy_engine.py youtube_strategy_app.py; then
            echo "Optimizer upgrade is already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add youtube_strategy_engine.py youtube_strategy_app.py
          git commit -m "Expand optimizer search and add full-window P/L mode"
          git push
