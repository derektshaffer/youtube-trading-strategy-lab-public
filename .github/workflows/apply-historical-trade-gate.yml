name: Apply historical minimum-trade gate

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-historical-trade-gate.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -r requirements.txt
      - name: Apply patch
        run: python .github/scripts/add_historical_trade_gate.py
      - name: Verify
        run: |
          python -m py_compile youtube_strategy_engine.py youtube_strategy_app.py
          python - <<'PY'
          import youtube_strategy_engine as e
          assert e.historical_minimum_trade_count(22) == 9
          assert e.historical_minimum_trade_count(30) == 10
          assert e.historical_minimum_trade_count(7) == 3
          weak = {"net_pnl": 5000, "return_pct": 250, "max_drawdown_pct": 0, "trade_count": 2}
          strong = {"net_pnl": 1000, "return_pct": 50, "max_drawdown_pct": 5, "trade_count": 9}
          assert e._historical_metric_key(strong, 15, 9) > e._historical_metric_key(weak, 15, 9)
          PY
          python -m unittest -q test_youtube_strategy_engine.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add youtube_strategy_engine.py youtube_strategy_app.py
          git commit -m "Require meaningful trade samples for historical optimizer"
          git push
