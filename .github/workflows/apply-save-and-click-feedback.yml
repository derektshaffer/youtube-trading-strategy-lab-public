name: Apply save naming and click feedback

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-save-and-click-feedback.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -r requirements.txt
      - name: Apply patch
        run: python .github/scripts/apply_save_and_click_feedback.py
      - name: Verify
        run: |
          python -m py_compile youtube_strategy_app.py youtube_strategy_engine.py
          grep -F 'Saved strategy name' youtube_strategy_app.py
          grep -F 'Allow re-analysis of videos already in my library' youtube_strategy_app.py
          grep -F 'def action_success' youtube_strategy_app.py
          grep -F 'custom_name: str | None = None' youtube_strategy_engine.py
          python -m unittest -q test_youtube_strategy_engine.py
      - name: Commit
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add youtube_strategy_app.py youtube_strategy_engine.py
          git commit -m "Add editable strategy names and click feedback"
          git push
