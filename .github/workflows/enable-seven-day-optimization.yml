name: Enable seven-day optimization

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/enable-seven-day-optimization.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-seven-day-window:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Allow seven-calendar-day optimization
        shell: python
        run: |
          from pathlib import Path

          app_path = Path("youtube_strategy_app.py")
          app = app_path.read_text(encoding="utf-8")
          app = app.replace(
              '"Historical calendar days",\n                min_value=20,',
              '"Historical calendar days",\n                min_value=7,',
              1,
          )
          if '"Historical calendar days",\n                min_value=7,' not in app:
              raise SystemExit("Could not enable the seven-day slider minimum.")
          app_path.write_text(app, encoding="utf-8")

          engine_path = Path("youtube_strategy_engine.py")
          engine = engine_path.read_text(encoding="utf-8")
          start = engine.index("def optimize_stock_strategies(")
          end = engine.index("\ndef finalize_stock_optimization(", start)
          before, function, after = engine[:start], engine[start:end], engine[end:]

          function = function.replace("if len(sessions) < 8:", "if len(sessions) < 3:", 1)
          function = function.replace(
              '"Optimization needs at least eight separate trading sessions so training, validation, "\n'
              '            "and final holdout periods stay separate. Request more historical data."',
              '"Optimization needs at least three separate trading sessions so training, validation, "\n'
              '            "and final holdout periods stay separate. Seven calendar days normally provides enough sessions; "\n'
              '            "holiday-shortened windows may need a few extra days."',
              1,
          )
          function = function.replace(
              "training_end = max(3, min(len(sessions) - 3, int(len(sessions) * optimizer.training_fraction)))",
              "training_end = max(1, min(len(sessions) - 2, int(len(sessions) * optimizer.training_fraction)))",
              1,
          )
          warning_anchor = "    warnings: list[str] = []\n"
          warning_block = (
              "    warnings: list[str] = []\n"
              "    if len(sessions) < 8:\n"
              "        warnings.append(\n"
              "            f\"Short optimization window: only {len(sessions)} trading sessions are available. \"\n"
              "            \"Results can be much noisier and more prone to overfitting than longer tests.\"\n"
              "        )\n"
          )
          if "Short optimization window:" not in function:
              if warning_anchor not in function:
                  raise SystemExit("Could not find the optimizer warning insertion point.")
              function = function.replace(warning_anchor, warning_block, 1)

          required = (
              "if len(sessions) < 3:",
              "training_end = max(1, min(len(sessions) - 2",
              "Short optimization window:",
          )
          missing = [item for item in required if item not in function]
          if missing:
              raise SystemExit(f"Seven-day optimizer patch incomplete: {missing}")

          engine_path.write_text(before + function + after, encoding="utf-8")

      - name: Verify Python syntax and seven-day settings
        shell: bash
        run: |
          python -m py_compile youtube_strategy_app.py youtube_strategy_engine.py
          python - <<'PY'
          from pathlib import Path
          app = Path("youtube_strategy_app.py").read_text()
          engine = Path("youtube_strategy_engine.py").read_text()
          assert '"Historical calendar days",\n                min_value=7,' in app
          assert "if len(sessions) < 3:" in engine
          assert "training_end = max(1, min(len(sessions) - 2" in engine
          assert "Short optimization window:" in engine
          PY

      - name: Commit patched app files
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Seven-day optimization is already enabled."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add youtube_strategy_app.py youtube_strategy_engine.py
          git commit -m "Allow seven-day optimization windows"
          git push
