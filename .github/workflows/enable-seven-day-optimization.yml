name: Enable seven-day optimization

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/enable-seven-day-optimization.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-seven-day-window:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Allow seven-calendar-day optimization
        shell: python
        run: |
          from pathlib import Path

          app_path = Path("youtube_strategy_app.py")
          app = app_path.read_text(encoding="utf-8")
          old_slider = '''                "Historical calendar days",
                          min_value=20,
                          max_value=180,
                          value=90,
          '''
          new_slider = '''                "Historical calendar days",
                          min_value=7,
                          max_value=180,
                          value=90,
          '''
          if old_slider in app:
              app = app.replace(old_slider, new_slider, 1)
          elif new_slider not in app:
              raise SystemExit("Could not find the Historical calendar days slider block.")
          app_path.write_text(app, encoding="utf-8")

          engine_path = Path("youtube_strategy_engine.py")
          engine = engine_path.read_text(encoding="utf-8")
          function_start = engine.index("def optimize_stock_strategies(")
          function_end = engine.index("\ndef finalize_stock_optimization(", function_start)
          before = engine[:function_start]
          function = engine[function_start:function_end]
          after = engine[function_end:]

          old_guard_and_split = '''    if len(sessions) < 8:
              raise AppError(
                  "Optimization needs at least eight separate trading sessions so training, validation, "
                  "and final holdout periods stay separate. Request more historical data."
              )

              training_end = max(3, min(len(sessions) - 3, int(len(sessions) * optimizer.training_fraction)))
              validation_end = max(
                  training_end + 1,
                  min(len(sessions) - 1, int(len(sessions) * (optimizer.training_fraction + optimizer.validation_fraction))),
              )
          '''
          new_guard_and_split = '''    if len(sessions) < 3:
              raise AppError(
                  "Optimization needs at least three separate trading sessions so training, validation, "
                  "and final holdout periods stay separate. Seven calendar days normally provides enough sessions; "
                  "holiday-shortened windows may need a few extra days."
              )

              training_end = max(1, min(len(sessions) - 2, int(len(sessions) * optimizer.training_fraction)))
              validation_end = max(
                  training_end + 1,
                  min(len(sessions) - 1, int(len(sessions) * (optimizer.training_fraction + optimizer.validation_fraction))),
              )
          '''
          if old_guard_and_split in function:
              function = function.replace(old_guard_and_split, new_guard_and_split, 1)
          elif new_guard_and_split not in function:
              raise SystemExit("Could not find the optimizer session guard/split block.")

          old_warning_anchor = '''    warnings: list[str] = []
              eligible: list[dict[str, Any]] = []
          '''
          new_warning_anchor = '''    warnings: list[str] = []
              if len(sessions) < 8:
                  warnings.append(
                      f"Short optimization window: only {len(sessions)} trading sessions are available. "
                      "Results can be much noisier and more prone to overfitting than longer tests."
                  )
              eligible: list[dict[str, Any]] = []
          '''
          if old_warning_anchor in function:
              function = function.replace(old_warning_anchor, new_warning_anchor, 1)
          elif new_warning_anchor not in function:
              raise SystemExit("Could not find the optimizer warnings block.")

          engine_path.write_text(before + function + after, encoding="utf-8")

      - name: Verify Python syntax and seven-day settings
        shell: bash
        run: |
          python -m py_compile youtube_strategy_app.py youtube_strategy_engine.py
          python - <<'PY'
          from pathlib import Path
          app = Path("youtube_strategy_app.py").read_text()
          engine = Path("youtube_strategy_engine.py").read_text()
          assert '"Historical calendar days",\n                min_value=7,' in app
          assert "if len(sessions) < 3:" in engine
          assert "training_end = max(1, min(len(sessions) - 2" in engine
          assert "Short optimization window:" in engine
          PY

      - name: Commit patched app files
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Seven-day optimization is already enabled."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add youtube_strategy_app.py youtube_strategy_engine.py
          git commit -m "Allow seven-day optimization windows"
          git push
