name: Increase optimizer badge contrast

on:
  push:
    paths:
      - '.github/workflows/increase-optimizer-badge-contrast.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply badge contrast patch
        run: python .github/scripts/increase_optimizer_badge_contrast.py
      - name: Verify
        run: |
          python -m py_compile youtube_strategy_app.py
          grep -q ':green-background\[🟩 AUTO\]' youtube_strategy_app.py
          grep -q ':orange-background\[🟧 CEILING\]' youtube_strategy_app.py
          grep -q ':yellow-background\[🟨 THRESHOLD\]' youtube_strategy_app.py
          grep -q ':blue-background\[🟦 SEARCH\]' youtube_strategy_app.py
          grep -q ':violet-background\[🟪 FLOOR\]' youtube_strategy_app.py
          grep -q ':gray-background\[⬜ FIXED\]' youtube_strategy_app.py
      - name: Commit
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add youtube_strategy_app.py
          git commit -m 'Increase optimizer category badge contrast'
          git push
