name: Fix historical optimizer results display

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-historical-results-index.yml"
      - ".github/scripts/fix_historical_results.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Patch results display
        run: python .github/scripts/fix_historical_results.py
      - name: Verify
        run: |
          python -m py_compile youtube_strategy_app.py youtube_strategy_engine.py
          python -m unittest -q test_youtube_strategy_engine.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add youtube_strategy_app.py
          git commit -m "Fix historical optimizer results display"
          git push
