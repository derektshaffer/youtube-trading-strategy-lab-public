name: Repaired combined regression verification

on:
  push:
    branches: [codex/regression-triage-20260913]
    paths: [.github/workflows/regression-triage.yml]

permissions:
  contents: read

jobs:
  repaired-combined:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: offscreen
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Retain frozen baseline dependency constraints
        run: cp .github/regression-frozen-dependencies.txt /tmp/lab-frozen-dependencies.txt
      - uses: actions/checkout@v4
        with:
          ref: 1b6150ab7d412382053d46f85e1a664f093c9b07
          fetch-depth: 0
      - name: Apply exact reviewed persistence patch without merging branches
        run: |
          git diff d5eb766bf64f73997ef808391e9d62d8996f031c a7e59078c79c298ea071a27ed63cdd91603ff98a -- youtube_strategy_engine.py strategy_lab_telemetry.py > /tmp/pr123.patch
          git apply --check /tmp/pr123.patch
          git apply /tmp/pr123.patch
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install identical frozen dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1
          python -m pip install -r /tmp/lab-frozen-dependencies.txt
          mkdir evidence
          python -m pip freeze > evidence/dependencies.txt
          diff /tmp/lab-frozen-dependencies.txt evidence/dependencies.txt
      - name: Freeze repaired source and environment
        run: |
          git rev-parse HEAD HEAD^{tree} > evidence/source.txt
          git status --porcelain --untracked-files=no >> evidence/source.txt
          git diff --binary > evidence/source.patch
          sha256sum youtube_strategy_engine.py strategy_lab_telemetry.py >> evidence/source.txt
          python --version > evidence/python.txt
          uname -a > evidence/platform.txt
      - name: Verify corrected UI contracts before the full suite
        run: python -m pytest -q -p no:cacheprovider test_readonly_validation_native.py test_saved_search_results.py --junitxml=evidence/ui-results.xml > evidence/ui-tests.log 2>&1
      - name: Full repaired combined suite
        run: python -m pytest -q -p no:cacheprovider --junitxml=evidence/results.xml > evidence/tests.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repaired-combined-c
          path: evidence/
