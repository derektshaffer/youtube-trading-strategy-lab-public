name: Apply adaptive optimizer

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-adaptive-optimizer.yml"
      - ".github/scripts/apply_adaptive_optimizer.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply adaptive optimizer
        run: python .github/scripts/apply_adaptive_optimizer.py
      - name: Verify adaptive search
        run: |
          python -m py_compile youtube_strategy_engine.py youtube_strategy_app.py
          python - <<'PY'
          from youtube_strategy_engine import (
              BacktestSettings,
              generate_local_strategy_refinements,
              generate_strategy_variants,
          )

          settings = BacktestSettings(
              starting_cash=2000,
              risk_per_trade_pct=10,
              max_position_pct=100,
              default_stop_pct=2,
              default_reward_risk=2,
              spread_bps=12,
              slippage_bps=8,
          )
          strategy = {
              "id": "adaptive-smoke",
              "name": "Adaptive smoke",
              "direction": "long",
              "machine_rules": {"stop_loss_pct": None, "reward_risk": 2.0},
          }
          coarse = generate_strategy_variants(strategy, settings, maximum=240)
          assert coarse
          seed = next((item for item in coarse if abs(float(item.get("stop_loss_pct") or 0) - 10.0) < 1e-9), coarse[0])
          fine = generate_local_strategy_refinements(seed, settings, maximum=80, stage="fine")
          final = []
          for item in [seed, *fine]:
              final.extend(generate_local_strategy_refinements(item, settings, maximum=80, stage="final"))
          all_rules = [*coarse, *fine, *final]
          assert any(abs(float(item.get("stop_loss_pct") or 0) - 9.5) < 1e-9 for item in all_rules), "Adaptive search cannot discover a 9.5% stop"
          PY
          python -m unittest -q test_youtube_strategy_engine.py
      - name: Commit adaptive optimizer
        run: |
          if git diff --quiet -- youtube_strategy_engine.py youtube_strategy_app.py; then
            echo "Adaptive optimizer already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add youtube_strategy_engine.py youtube_strategy_app.py
          git commit -m "Add adaptive coarse-to-fine optimizer"
          git push
