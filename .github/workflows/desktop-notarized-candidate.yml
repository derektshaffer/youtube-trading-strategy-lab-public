name: Trading Intelligence Notarized Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Candidate version label, for example 0.1.0-beta.5"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: trading-intelligence-notarized-candidate
  cancel-in-progress: false

jobs:
  notarized-candidate:
    name: Developer ID + notarization · Apple Silicon
    runs-on: macos-14
    timeout-minutes: 150
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      QT_QPA_PLATFORM: offscreen
      APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
      APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
      APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
      APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt
            requirements-desktop-pyside.txt

      - name: Verify native Apple Silicon runner and release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          python -c 'import platform; assert platform.machine() == "arm64"'
          test "$(git branch --show-current)" = "main"

      - name: Validate Apple distribution credentials
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in \
            APPLE_DEVELOPER_ID_P12_BASE64 \
            APPLE_DEVELOPER_ID_P12_PASSWORD \
            APPLE_NOTARY_APPLE_ID \
            APPLE_NOTARY_PASSWORD \
            APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required macOS distribution secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Install desktop dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-desktop-pyside.txt "pytest>=8,<9"

      - name: Run release and desktop regressions
        run: |
          python -m pytest -q \
            test_desktop_notarized_release.py \
            test_desktop_beta_release.py \
            test_desktop_profit_first_app.py \
            test_desktop_strategy_lab_cloud.py

      - name: Build sidecar and production app
        run: |
          python scripts/build_desktop_sidecar.py --target-triple aarch64-apple-darwin
          python scripts/build_trading_intelligence_desktop.py
          APP=".desktop_build/production/dist/Trading Intelligence.app"
          test -d "$APP"
          file "$APP/Contents/MacOS/Trading Intelligence" | grep -q "arm64"

      - name: Stamp final bundle metadata before distribution signing
        run: |
          python scripts/stamp_desktop_bundle.py \
            --app ".desktop_build/production/dist/Trading Intelligence.app" \
            --version "${{ inputs.version }}" \
            --build-number "$GITHUB_RUN_NUMBER"

      - name: Import Developer ID certificate into temporary keychain
        shell: bash
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/trading-intelligence-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          CERTIFICATE_PATH="$CERTIFICATE_PATH" python - <<'PY'
          import base64, os
          from pathlib import Path
          raw = os.environ["APPLE_DEVELOPER_ID_P12_BASE64"].strip()
          Path(os.environ["CERTIFICATE_PATH"]).write_bytes(base64.b64decode(raw, validate=True))
          PY
          chmod 600 "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" \
            -A -t cert -f pkcs12
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
          if [ -z "$IDENTITY" ]; then
            echo "::error::Imported certificate does not contain a Developer ID Application signing identity."
            exit 1
          fi
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Apply Developer ID hardened-runtime signature
        run: |
          python scripts/sign_desktop_distribution.py \
            --app ".desktop_build/production/dist/Trading Intelligence.app" \
            --identity "$CODESIGN_IDENTITY"

      - name: Smoke Developer ID-signed app before notarization
        shell: bash
        run: |
          set -euo pipefail
          APP=".desktop_build/production/dist/Trading Intelligence.app"
          APP_EXE="$APP/Contents/MacOS/Trading Intelligence"
          cat > "$RUNNER_TEMP/notarized-empty-library.json" <<'JSON'
          {
            "strategies": [],
            "validation_runs": [],
            "research_queue": [],
            "predictive_ml_runs": [],
            "knowledge_sources": []
          }
          JSON
          rm -rf "$RUNNER_TEMP/notarized-candidate-smoke"
          TRADING_INTELLIGENCE_DESKTOP_DATA_DIR="$RUNNER_TEMP/notarized-candidate-smoke" \
            "$APP_EXE" \
            --smoke \
            --library-fixture "$RUNNER_TEMP/notarized-empty-library.json" \
            --metrics-output "$RUNNER_TEMP/notarized-candidate-smoke.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path(os.environ["RUNNER_TEMP"], "notarized-candidate-smoke.json").read_text())
          assert data["status"] == "passed", data
          PY

      - name: Submit app ZIP to Apple notary service
        shell: bash
        run: |
          set -euo pipefail
          APP=".desktop_build/production/dist/Trading Intelligence.app"
          UPLOAD="$RUNNER_TEMP/trading-intelligence-notary-upload.zip"
          rm -f "$UPLOAD"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$UPLOAD"
          xcrun notarytool submit "$UPLOAD" \
            --apple-id "$APPLE_NOTARY_APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_NOTARY_PASSWORD" \
            --wait \
            --output-format json > "$RUNNER_TEMP/app-notary-result.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path(os.environ["RUNNER_TEMP"], "app-notary-result.json").read_text())
          assert result.get("status") == "Accepted", result
          PY

      - name: Staple and require public-ready app
        run: |
          APP=".desktop_build/production/dist/Trading Intelligence.app"
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          python scripts/check_desktop_release_readiness.py \
            --app "$APP" \
            --output "$RUNNER_TEMP/app-release-readiness.json" \
            --require-public-ready

      - name: Create final distribution containers without modifying app
        shell: bash
        run: |
          set -euo pipefail
          DIST="$RUNNER_TEMP/trading-intelligence-notarized"
          rm -rf "$DIST"
          mkdir -p "$DIST"
          python scripts/package_signed_desktop.py \
            --app ".desktop_build/production/dist/Trading Intelligence.app" \
            --output-dir "$DIST" \
            --version "${{ inputs.version }}"
          DMG="$(find "$DIST" -maxdepth 1 -name '*.dmg' -print -quit)"
          ZIP="$(find "$DIST" -maxdepth 1 -name '*.zip' -print -quit)"
          test -n "$DMG"
          test -n "$ZIP"
          echo "DIST_DMG=$DMG" >> "$GITHUB_ENV"
          echo "DIST_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Sign, notarize, and staple final DMG
        shell: bash
        run: |
          set -euo pipefail
          codesign --force --timestamp --sign "$CODESIGN_IDENTITY" "$DIST_DMG"
          codesign --verify --verbose=4 "$DIST_DMG"
          xcrun notarytool submit "$DIST_DMG" \
            --apple-id "$APPLE_NOTARY_APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_NOTARY_PASSWORD" \
            --wait \
            --output-format json > "$RUNNER_TEMP/dmg-notary-result.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path(os.environ["RUNNER_TEMP"], "dmg-notary-result.json").read_text())
          assert result.get("status") == "Accepted", result
          PY
          xcrun stapler staple "$DIST_DMG"
          xcrun stapler validate "$DIST_DMG"
          spctl -a -t open --context context:primary-signature -v "$DIST_DMG"

      - name: Mount final DMG and verify contained app
        shell: bash
        run: |
          set -euo pipefail
          MOUNT="$RUNNER_TEMP/notarized-dmg-mounted"
          rm -rf "$MOUNT"
          mkdir -p "$MOUNT"
          hdiutil attach -nobrowse -readonly -mountpoint "$MOUNT" "$DIST_DMG"
          trap 'hdiutil detach "$MOUNT" || true' EXIT
          test -d "$MOUNT/Trading Intelligence.app"
          file "$MOUNT/Trading Intelligence.app/Contents/MacOS/Trading Intelligence" | grep -q "arm64"
          python scripts/check_desktop_release_readiness.py \
            --app "$MOUNT/Trading Intelligence.app" \
            --require-public-ready
          hdiutil detach "$MOUNT"
          trap - EXIT

      - name: Finalize notarized candidate manifest and checksums
        run: |
          python scripts/finalize_desktop_distribution.py \
            --app ".desktop_build/production/dist/Trading Intelligence.app" \
            --dmg "$DIST_DMG" \
            --zip "$DIST_ZIP" \
            --output-dir "$RUNNER_TEMP/trading-intelligence-notarized" \
            --version "${{ inputs.version }}" \
            --build-number "$GITHUB_RUN_NUMBER" \
            --commit "$GITHUB_SHA"

      - name: Upload notarized candidate only
        uses: actions/upload-artifact@v4
        with:
          name: trading-intelligence-notarized-candidate-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/trading-intelligence-notarized/*.dmg
            ${{ runner.temp }}/trading-intelligence-notarized/*.zip
            ${{ runner.temp }}/trading-intelligence-notarized/*.json
            ${{ runner.temp }}/trading-intelligence-notarized/SHA256SUMS.txt
            ${{ runner.temp }}/app-release-readiness.json
            ${{ runner.temp }}/app-notary-result.json
            ${{ runner.temp }}/dmg-notary-result.json
            ${{ runner.temp }}/notarized-candidate-smoke.json

      - name: Remove temporary signing keychain
        if: always()
        shell: bash
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
