name: Finalize optimizer defaults

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-optimizer-defaults.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align manual and optimizer assumptions
        shell: python
        run: |
          from pathlib import Path
          path = Path("youtube_strategy_app.py")
          text = path.read_text(encoding="utf-8")
          old_risk = '''            optimizer_risk = third_row[0].number_input(
              "Maximum risk per trade to test (%)",
              min_value=0.05,
              max_value=10.0,
              value=2.0,
              step=0.05,
          '''
          new_risk = '''            optimizer_risk = third_row[0].number_input(
              "Maximum risk per trade to test (%)",
              min_value=0.05,
              max_value=10.0,
              value=float(manual_optimizer_defaults.get("risk_per_trade_pct", 10.0)),
              step=0.05,
          '''
          if old_risk in text:
              text = text.replace(old_risk, new_risk, 1)
          elif 'value=float(manual_optimizer_defaults.get("risk_per_trade_pct", 10.0))' not in text:
              raise SystemExit("Could not align optimizer risk default")

          old_reward = '''            optimizer_reward = third_row[3].number_input(
              "Fallback reward/risk",
              min_value=0.2,
              max_value=10.0,
              value=2.0,
              step=0.1,
          '''
          new_reward = '''            optimizer_reward = third_row[3].number_input(
              "Fallback reward/risk",
              min_value=0.2,
              max_value=10.0,
              value=float(manual_optimizer_defaults.get("default_reward_risk", 2.0)),
              step=0.1,
          '''
          if old_reward in text:
              text = text.replace(old_reward, new_reward, 1)
          elif 'value=float(manual_optimizer_defaults.get("default_reward_risk", 2.0))' not in text:
              raise SystemExit("Could not align optimizer reward/risk default")

          path.write_text(text, encoding="utf-8")
      - name: Verify
        run: |
          python -m py_compile youtube_strategy_app.py youtube_strategy_engine.py
          grep -F 'value=float(manual_optimizer_defaults.get("risk_per_trade_pct", 10.0))' youtube_strategy_app.py
          grep -F 'value=float(manual_optimizer_defaults.get("default_reward_risk", 2.0))' youtube_strategy_app.py
      - name: Commit
        run: |
          if git diff --quiet -- youtube_strategy_app.py; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add youtube_strategy_app.py
          git commit -m "Match optimizer defaults to manual backtest"
          git push
