name: Finalize optimizer defaults

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-optimizer-defaults.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align manual and optimizer assumptions
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("youtube_strategy_app.py")
          text = path.read_text(encoding="utf-8")

          def replace_widget_default(text, variable, replacement):
              pattern = rf'({re.escape(variable)}\s*=.*?number_input\(.*?)(\n\s*value=)[^,]+(,\n\s*step=)'
              updated, count = re.subn(
                  pattern,
                  lambda m: m.group(1) + m.group(2) + replacement + m.group(3),
                  text,
                  count=1,
                  flags=re.DOTALL,
              )
              if count != 1:
                  raise SystemExit(f"Could not align {variable} default")
              return updated

          text = replace_widget_default(
              text,
              "optimizer_risk",
              'float(manual_optimizer_defaults.get("risk_per_trade_pct", 10.0))',
          )
          text = replace_widget_default(
              text,
              "optimizer_reward",
              'float(manual_optimizer_defaults.get("default_reward_risk", 2.0))',
          )
          path.write_text(text, encoding="utf-8")
      - name: Verify
        run: |
          python -m py_compile youtube_strategy_app.py youtube_strategy_engine.py
          grep -F 'value=float(manual_optimizer_defaults.get("risk_per_trade_pct", 10.0))' youtube_strategy_app.py
          grep -F 'value=float(manual_optimizer_defaults.get("default_reward_risk", 2.0))' youtube_strategy_app.py
      - name: Commit
        run: |
          if git diff --quiet -- youtube_strategy_app.py; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add youtube_strategy_app.py
          git commit -m "Match optimizer defaults to manual backtest"
          git push
