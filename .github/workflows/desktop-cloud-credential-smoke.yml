name: Desktop Cloud Credential Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-cloud-credential-smoke
  cancel-in-progress: true

jobs:
  handshake:
    name: Cloud dispatch handshake
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm workflow dispatch reached GitHub Actions
        shell: bash
        run: |
          set -euo pipefail
          echo "Trading Intelligence desktop cloud-dispatch permission verified."
