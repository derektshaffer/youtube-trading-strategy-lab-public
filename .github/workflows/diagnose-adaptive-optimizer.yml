name: Diagnose adaptive optimizer

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-adaptive-optimizer.yml"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -r requirements.txt
      - name: Run end-to-end optimizer smoke tests
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo
          import youtube_strategy_engine as e

          ET = ZoneInfo("America/New_York")
          def bar(day, minute, o, h, l, c, v=1000):
              local = datetime(2026, 8, day, 9, 30, tzinfo=ET) + timedelta(minutes=minute)
              return {"t": local.astimezone(timezone.utc).isoformat().replace("+00:00", "Z"), "o":o,"h":h,"l":l,"c":c,"v":v}

          rows=[]
          for day in range(1, 13):
              base=10 + day * 0.05
              for minute in range(40):
                  o=base + minute*0.01
                  c=o + (0.03 if minute % 3 else -0.01)
                  rows.append(bar(day, minute, o, max(o,c)+0.05, min(o,c)-0.03, c, 1000+minute*25+day*10))

          strategy={
              "id":"smoke-strategy",
              "name":"Smoke strategy",
              "direction":"long",
              "machine_rules": e.normalize_machine_rules({
                  "min_price":1,
                  "stop_loss_pct":5,
                  "reward_risk":1,
                  "max_hold_minutes":20,
              }),
              "unresolved_rules":[],
          }
          settings=e.BacktestSettings(starting_cash=2000,risk_per_trade_pct=10,max_position_pct=100,default_stop_pct=2,default_reward_risk=2,spread_bps=12,slippage_bps=8)
          opt=e.OptimizationSettings(max_variants_per_strategy=48,finalists_per_strategy=8,max_execution_variants_per_finalist=8,minimum_training_trades=1,minimum_validation_trades=1,selection_mode="historical_pnl")
          report=e.optimize_stock_strategies(rows,[strategy],"DFNS",settings,opt)
          assert report.get("symbol")=="DFNS", report
          assert report.get("rankings"), report
          assert report.get("winner"), report
          print("single timeframe ok", report["winner"]["optimized_rules"].get("stop_loss_pct"), report.get("variants_tested"))

          report2=e.optimize_stock_timeframes(rows,[strategy],"DFNS",settings,opt,timeframes=("1Min","5Min","15Min"))
          assert report2.get("symbol")=="DFNS", report2
          assert report2.get("rankings"), report2
          assert report2.get("winner"), report2
          assert report2.get("timeframe") in {"1Min","5Min","15Min"}, report2
          print("multi timeframe ok", report2["timeframe"], report2.get("variants_tested"))
          PY
