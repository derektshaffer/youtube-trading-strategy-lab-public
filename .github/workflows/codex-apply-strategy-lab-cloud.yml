name: Apply Strategy Lab cloud integration

on:
  push:
    branches:
      - codex/desktop-strategy-lab-cloud-20260902
    paths:
      - ".codex/apply_strategy_lab_cloud.py"
      - ".github/workflows/codex-apply-strategy-lab-cloud.yml"
      - "cloud_strategy_lab_worker.py"
      - "hybrid_runtime/strategy_lab_bridge.py"
      - "hybrid_runtime/strategy_lab_options.py"
      - "desktop/trading_intelligence/strategy_lab_page.py"
      - "desktop/trading_intelligence/strategy_lab_window.py"
      - "test_strategy_lab_cloud_bridge.py"
      - "test_desktop_strategy_lab_cloud.py"
      - "test_desktop_cloud_bridge_activation.py"

permissions:
  contents: write

concurrency:
  group: codex-apply-strategy-lab-cloud
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/desktop-strategy-lab-cloud-20260902
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Apply guarded Strategy Lab transformation
        run: python .codex/apply_strategy_lab_cloud.py

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-desktop.txt
          python -m pip install "pytest>=8,<9"

      - name: Run Strategy Lab cloud regressions
        run: |
          python -m pytest -q \
            test_strategy_lab_cloud_bridge.py \
            test_desktop_strategy_lab_cloud.py \
            test_desktop_cloud_bridge_activation.py \
            test_hybrid_cloud_bridge.py \
            test_desktop_results_summary.py \
            test_hybrid_runtime.py \
            test_hybrid_runtime_hardening.py
          python -m py_compile \
            cloud_strategy_lab_worker.py \
            hybrid_runtime/cloud_bridge.py \
            hybrid_runtime/strategy_lab_bridge.py \
            hybrid_runtime/strategy_lab_options.py \
            desktop/trading_intelligence/strategy_lab_page.py \
            desktop/trading_intelligence/strategy_lab_window.py
          git diff --check

      - name: Commit applied integration and remove temporary applicator
        shell: bash
        run: |
          set -euo pipefail
          rm -f .codex/apply_strategy_lab_cloud.py
          rmdir .codex 2>/dev/null || true
          rm -f .github/workflows/codex-apply-strategy-lab-cloud.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Run Strategy Lab on reconnect-safe cloud worker"
          git push origin HEAD:codex/desktop-strategy-lab-cloud-20260902
