name: Trading Intelligence Desktop Beta Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Internal beta version label, for example 0.1.0-beta.3"
        required: false
        default: ""
        type: string
  pull_request:
    paths:
      - "desktop/trading_intelligence/**"
      - "hybrid_runtime/**"
      - "scripts/build_desktop_sidecar.py"
      - "scripts/build_trading_intelligence_desktop.py"
      - "scripts/package_desktop_beta.py"
      - "scripts/check_desktop_release_readiness.py"
      - "test_desktop_beta_release.py"
      - ".github/workflows/desktop-beta-package.yml"

permissions:
  contents: read

concurrency:
  group: trading-intelligence-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  internal-beta:
    name: Internal beta · Apple Silicon
    runs-on: macos-14
    timeout-minutes: 100
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt
            requirements-desktop-pyside.txt

      - name: Verify native Apple Silicon runner
        run: |
          test "$(uname -m)" = "arm64"
          python -c 'import platform; assert platform.machine() == "arm64"'

      - name: Install desktop dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-desktop-pyside.txt "pytest>=8,<9"

      - name: Run beta packaging regressions
        run: |
          python -m pytest -q \
            test_desktop_beta_release.py \
            test_desktop_profit_first_app.py \
            test_desktop_strategy_lab_cloud.py

      - name: Build packaged Python sidecar
        run: |
          python scripts/build_desktop_sidecar.py --target-triple aarch64-apple-darwin
          SIDECAR=".desktop_build/dist/trading-intelligence-service"
          file "$SIDECAR" | grep -q "arm64"
          codesign --verify --verbose=4 "$SIDECAR"

      - name: Build production desktop app
        run: python scripts/build_trading_intelligence_desktop.py

      - name: Smoke the complete desktop app before packaging
        run: |
          APP=".desktop_build/production/dist/Trading Intelligence.app"
          APP_EXE="$APP/Contents/MacOS/Trading Intelligence"
          test -d "$APP"
          test -x "$APP_EXE"
          file "$APP_EXE" | grep -q "arm64"
          codesign --verify --deep --strict --verbose=4 "$APP"
          cat > "$RUNNER_TEMP/empty-library.json" <<'JSON'
          {
            "strategies": [],
            "validation_runs": [],
            "research_queue": [],
            "predictive_ml_runs": [],
            "knowledge_sources": []
          }
          JSON
          rm -rf "$RUNNER_TEMP/trading-intelligence-beta-smoke"
          TRADING_INTELLIGENCE_DESKTOP_DATA_DIR="$RUNNER_TEMP/trading-intelligence-beta-smoke" \
            "$APP_EXE" \
            --smoke \
            --library-fixture "$RUNNER_TEMP/empty-library.json" \
            --metrics-output "$RUNNER_TEMP/trading-intelligence-beta-smoke.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path(os.environ["RUNNER_TEMP"], "trading-intelligence-beta-smoke.json").read_text())
          assert data["status"] == "passed", data
          assert data["product"] == "trading-intelligence-desktop", data
          PY

      - name: Package verified DMG and ZIP
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="0.1.0-beta.${GITHUB_RUN_NUMBER}"
          fi
          echo "BETA_VERSION=$VERSION" >> "$GITHUB_ENV"
          python scripts/package_desktop_beta.py \
            --app ".desktop_build/production/dist/Trading Intelligence.app" \
            --output-dir "$RUNNER_TEMP/trading-intelligence-beta" \
            --version "$VERSION" \
            --build-number "$GITHUB_RUN_NUMBER" \
            --commit "$GITHUB_SHA"

      - name: Verify internal-beta classification
        run: |
          APP=".desktop_build/production/dist/Trading Intelligence.app"
          python scripts/check_desktop_release_readiness.py \
            --app "$APP" \
            --output "$RUNNER_TEMP/trading-intelligence-beta/release-readiness.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path(os.environ["RUNNER_TEMP"], "trading-intelligence-beta", "release-readiness.json").read_text())
          assert report["codesign_valid"] is True, report
          # This workflow deliberately uses ad-hoc signing. It must never be
          # classified as public-release ready.
          assert report["public_distribution_ready"] is False, report
          assert report["classification"] == "internal_beta_only", report
          PY

      - name: Mount packaged DMG and re-verify app
        shell: bash
        run: |
          set -euo pipefail
          DMG="$(find "$RUNNER_TEMP/trading-intelligence-beta" -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$DMG"
          MOUNT="$RUNNER_TEMP/trading-intelligence-beta-mounted"
          rm -rf "$MOUNT"
          mkdir -p "$MOUNT"
          hdiutil attach -nobrowse -readonly -mountpoint "$MOUNT" "$DMG"
          trap 'hdiutil detach "$MOUNT" || true' EXIT
          test -d "$MOUNT/Trading Intelligence.app"
          codesign --verify --deep --strict --verbose=4 "$MOUNT/Trading Intelligence.app"
          file "$MOUNT/Trading Intelligence.app/Contents/MacOS/Trading Intelligence" | grep -q "arm64"
          hdiutil detach "$MOUNT"
          trap - EXIT

      - name: Upload internal beta package
        uses: actions/upload-artifact@v4
        with:
          name: trading-intelligence-internal-beta-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/trading-intelligence-beta/*.dmg
            ${{ runner.temp }}/trading-intelligence-beta/*.zip
            ${{ runner.temp }}/trading-intelligence-beta/*.json
            ${{ runner.temp }}/trading-intelligence-beta/SHA256SUMS.txt
            ${{ runner.temp }}/trading-intelligence-beta-smoke.json
