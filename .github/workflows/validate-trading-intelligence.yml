name: Validate Trading Intelligence Lab

on:
  push:
    branches: [main]
    paths:
      - "trading_intelligence_app.py"
      - "trading_glass_theme.py"
      - "trading_intelligence_core.py"
      - "trading_progress_ui.py"
      - "pages/Full_Trading_Lab.py"
      - "youtube_strategy_app_core.py"
      - "live_strategy_runner_page.py"
      - "simple_dashboard_core.py"
      - "machine_learning_lab_core.py"
      - "trading_strategy_dna.py"
      - "trading_auto_research.py"
      - "trading_validation_core.py"
      - "trading_market_discovery.py"
      - "trading_catalyst_core.py"
      - "trading_universe_research.py"
      - "youtube_strategy_engine.py"
      - "requirements.txt"
      - "test_youtube_strategy_engine.py"
      - "test_trading_validation_core.py"
      - "test_trading_catalyst_core.py"
      - "test_trading_intelligence_core.py"
      - "test_trading_strategy_dna.py"
      - "test_trading_auto_research.py"
      - "test_trading_universe_research.py"
      - "test_trading_progress_ui.py"
      - "test_full_lab_patch_targets.py"
      - ".github/workflows/validate-trading-intelligence.yml"
  pull_request:
    paths:
      - "trading_intelligence_app.py"
      - "trading_glass_theme.py"
      - "trading_intelligence_core.py"
      - "trading_progress_ui.py"
      - "pages/Full_Trading_Lab.py"
      - "youtube_strategy_app_core.py"
      - "live_strategy_runner_page.py"
      - "simple_dashboard_core.py"
      - "machine_learning_lab_core.py"
      - "trading_strategy_dna.py"
      - "trading_auto_research.py"
      - "trading_validation_core.py"
      - "youtube_strategy_engine.py"
      - "test_trading_auto_research.py"
      - "test_trading_progress_ui.py"
      - "test_full_lab_patch_targets.py"
      - "requirements.txt"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Trading Intelligence modules
        run: |
          python -m py_compile trading_intelligence_app.py
          python -m py_compile trading_glass_theme.py
          python -m py_compile trading_intelligence_core.py
          python -m py_compile trading_progress_ui.py
          python -m py_compile machine_learning_lab_core.py
          python -m py_compile simple_dashboard_core.py
          python -m py_compile live_strategy_runner_page.py
          python -m py_compile youtube_strategy_app_core.py
          python -m py_compile pages/Full_Trading_Lab.py
          python -m py_compile trading_strategy_dna.py
          python -m py_compile trading_auto_research.py
          python -m py_compile trading_validation_core.py
          python -m py_compile trading_market_discovery.py
          python -m py_compile trading_catalyst_core.py
          python -m py_compile trading_universe_research.py
          python -m py_compile youtube_strategy_engine.py
      - name: Run Trading Intelligence tests
        run: python -m unittest test_youtube_strategy_engine.py test_trading_validation_core.py test_trading_catalyst_core.py test_trading_intelligence_core.py test_trading_strategy_dna.py test_trading_universe_research.py test_trading_auto_research.py test_trading_progress_ui.py test_full_lab_patch_targets.py -q
