name: Validate Trading Intelligence Lab

on:
  push:
    branches: [main]
    paths:
      - "trading_intelligence_app.py"
      - "trading_intelligence_core.py"
      - "trading_validation_core.py"
      - "trading_market_discovery.py"
      - "youtube_strategy_engine.py"
      - "requirements.txt"
      - "test_youtube_strategy_engine.py"
      - ".github/workflows/validate-trading-intelligence.yml"
  pull_request:
    paths:
      - "trading_intelligence_app.py"
      - "trading_intelligence_core.py"
      - "trading_validation_core.py"
      - "youtube_strategy_engine.py"
      - "requirements.txt"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Trading Intelligence modules
        run: |
          python -m py_compile trading_intelligence_app.py
          python -m py_compile trading_intelligence_core.py
          python -m py_compile trading_validation_core.py
          python -m py_compile trading_market_discovery.py
          python -m py_compile youtube_strategy_engine.py
      - name: Run existing strategy-engine tests
        run: python -m unittest test_youtube_strategy_engine.py -q
