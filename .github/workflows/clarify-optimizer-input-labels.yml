name: Clarify optimizer input labels

on:
  push:
    paths:
      - '.github/workflows/clarify-optimizer-input-labels.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -r requirements.txt
      - name: Apply patch
        run: python .github/scripts/clarify_optimizer_input_labels.py
      - name: Verify
        run: |
          python -m py_compile youtube_strategy_app.py youtube_strategy_engine.py
          grep -F '🟠 CEILING · Risk per trade (%)' youtube_strategy_app.py
          grep -F '🟠 CEILING · Position size (% of account)' youtube_strategy_app.py
          grep -F '🟢 AUTO-SEARCH · Stop loss (fallback seed %)' youtube_strategy_app.py
          grep -F '🔒 FIXED · Spread estimate (bps)' youtube_strategy_app.py
          grep -F 'How optimizer inputs work' youtube_strategy_app.py
          python -m unittest -q test_youtube_strategy_engine.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add youtube_strategy_app.py
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Clarify stock optimizer input behavior'
            git push
          fi
