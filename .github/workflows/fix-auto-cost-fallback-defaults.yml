name: Fix automatic cost fallback defaults

on:
  push:
    paths:
      - '.github/workflows/fix-auto-cost-fallback-defaults.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -r requirements.txt
      - run: python .github/scripts/fix_auto_cost_fallback_defaults.py
      - name: Verify
        run: |
          python -m py_compile youtube_strategy_app.py youtube_strategy_engine.py
          grep -q '12.0 if automatic_execution_costs' youtube_strategy_app.py
          grep -q '8.0 if automatic_execution_costs' youtube_strategy_app.py
      - name: Commit
        run: |
          if git diff --quiet youtube_strategy_app.py; then
            echo 'No source changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add youtube_strategy_app.py
          git commit -m 'Use stable automatic execution cost floors'
          git push
