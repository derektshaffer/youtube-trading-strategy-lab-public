name: Apply seven-day optimizer patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-seven-day-optimizer.yml

permissions:
  contents: write

jobs:
  patch-optimizer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Change optimizer minimum to seven days
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("youtube_strategy_app.py")
          text = path.read_text(encoding="utf-8")
          pattern = r'("Historical calendar days",\s*\n\s*)min_value=20,'
          updated, count = re.subn(pattern, r'\1min_value=7,', text, count=1)

          if count == 1:
              path.write_text(updated, encoding="utf-8")
          elif re.search(r'"Historical calendar days",\s*\n\s*min_value=7,', text):
              print("Optimizer is already set to seven days.")
          else:
              raise SystemExit("Could not find the Historical calendar days minimum.")
          PY

      - name: Commit the one-line app change
        run: |
          if git diff --quiet -- youtube_strategy_app.py; then
            echo "No app change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add youtube_strategy_app.py
          git commit -m "Allow 7-day strategy optimization"
          git push origin HEAD:main
