name: Move strategy save controls to top

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/move-strategy-save-controls.yml"
      - ".github/scripts/move_strategy_save_controls.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply strategy editor layout fix
        run: python .github/scripts/move_strategy_save_controls.py
      - name: Syntax check
        run: python -m py_compile youtube_strategy_app_core.py
      - name: Commit UI fix
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add youtube_strategy_app_core.py
          git commit -m "Move strategy save controls to top"
          git push
