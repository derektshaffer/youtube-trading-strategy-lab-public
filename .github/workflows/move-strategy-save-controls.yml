name: Move strategy save controls to top

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/move-strategy-save-controls.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move approval and save controls
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("youtube_strategy_app_core.py")
          text = path.read_text(encoding="utf-8")

          old_start = '''        with st.form(f"edit_strategy_{selected['id']}"):
              column_one, column_two, column_three = st.columns(3)
              updated: dict[str, Any] = {}
          '''
          # Preserve the repository's exact eight-space indentation. The compact
          # marker below avoids replacing any unrelated form.
          old_start = '''        with st.form(f"edit_strategy_{selected['id']}"):
              column_one, column_two, column_three = st.columns(3)
              updated: dict[str, Any] = {}
          '''.replace('              ', '            ')

          new_start = '''        with st.form(f"edit_strategy_{selected['id']}"):
              save_controls = st.columns([3.0, 1.35])
              with save_controls[0]:
                  approved = st.checkbox(
                      "Approve this strategy for matching in the live scanner",
                      value=bool(selected.get("approved")),
                      help="Approval enables research alerts only. This app never sends brokerage orders.",
                  )
              with save_controls[1]:
                  save_strategy = st.form_submit_button(
                      "Save strategy rules",
                      type="primary",
                      use_container_width=True,
                  )
              st.caption("Edit the measurable rules below, then use the Save strategy rules button above.")
              st.divider()

              column_one, column_two, column_three = st.columns(3)
              updated: dict[str, Any] = {}
          '''.replace('              ', '            ')

          old_end = '''            approved = st.checkbox(
                  "Approve this strategy for matching in the live scanner",
                  value=bool(selected.get("approved")),
                  help="Approval enables research alerts only. This app never sends brokerage orders.",
              )
              save_strategy = st.form_submit_button("Save strategy rules", use_container_width=True)
          '''.replace('              ', '            ')

          if old_start not in text:
              raise SystemExit("Could not find strategy-edit form start; refusing to patch.")
          if old_end not in text:
              raise SystemExit("Could not find bottom approval/save controls; refusing to patch.")

          text = text.replace(old_start, new_start, 1)
          text = text.replace(old_end, '', 1)

          if text.count('st.form_submit_button(\n                "Save strategy rules"') != 1:
              raise SystemExit("Expected exactly one top Save strategy rules button after patch.")
          if text.find('"Save strategy rules"') > text.find('updated["min_price"]'):
              raise SystemExit("Save strategy rules button was not moved above the rule fields.")

          path.write_text(text, encoding="utf-8")
          print("Moved strategy approval and save controls above measurable rules.")
          PY
      - name: Syntax check
        run: python -m py_compile youtube_strategy_app_core.py
      - name: Commit UI fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add youtube_strategy_app_core.py
          git commit -m "Move strategy save controls to top"
          git push
