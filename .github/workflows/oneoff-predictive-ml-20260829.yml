name: One-Off Predictive ML Experiment

on:
  push:
    branches:
      - experiment/predictive-ml-20260829

permissions:
  contents: read

jobs:
  run-ml:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_LIVE_FEED: ${{ vars.ALPACA_LIVE_FEED || 'iex' }}
      ALPACA_HISTORICAL_FEED: ${{ vars.ALPACA_HISTORICAL_FEED || 'sip' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate Alpaca secrets
        shell: bash
        run: |
          missing=0
          for name in ALPACA_API_KEY ALPACA_SECRET_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Run exact predictive ML pipeline
        run: python oneoff_predictive_ml_experiment.py

      - name: Upload experiment result
        uses: actions/upload-artifact@v4
        with:
          name: predictive-ml-experiment-result
          path: predictive_ml_experiment_result.json
          retention-days: 7
