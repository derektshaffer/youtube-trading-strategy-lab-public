name: Refine optimizer safeguard and badges

on:
  push:
    paths:
      - '.github/workflows/refine-optimizer-safeguard-and-badges.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply UI refinement
        run: python .github/scripts/refine_optimizer_safeguard_and_badges.py
      - name: Verify
        run: |
          python -m py_compile youtube_strategy_app.py youtube_strategy_engine.py
          grep -Fq 'Maximum acceptable drawdown (%) · :yellow-background[THRESHOLD]' youtube_strategy_app.py
          grep -Fq 'Position-size search depth · :blue-background[SEARCH]' youtube_strategy_app.py
          grep -Fq ':green-background[ON] At least 8 completed trades required' youtube_strategy_app.py
          grep -Fq 'Risk per trade (%) · :orange-background[CEILING]' youtube_strategy_app.py
          grep -Fq 'Stop loss (fallback seed %) · :green-background[AUTO]' youtube_strategy_app.py
          python - <<'PY'
          from pathlib import Path
          text = Path('youtube_strategy_app.py').read_text(encoding='utf-8')
          guard = text.index('with st.container(border=True, key="eight_trade_safeguard")')
          drawdown = text.index('Maximum acceptable drawdown (%) · :yellow-background[THRESHOLD]')
          submit = text.index('optimization_requested = st.form_submit_button', drawdown)
          assert drawdown < guard < submit, (drawdown, guard, submit)
          assert 'st.success("✓ ON — results need at least 8 completed trades' not in text
          print('safeguard order and compact status verified')
          PY
      - name: Commit
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add youtube_strategy_app.py
          git commit -m 'Refine optimizer safeguard and input badges'
          git push
