name: Apply Stock Finder cloud bridge

on:
  push:
    branches:
      - codex/desktop-stock-finder-20260902
    paths:
      - ".codex/apply_stock_finder_cloud_bridge.py"
      - ".github/workflows/codex-apply-stock-finder-cloud-bridge.yml"
      - "hybrid_runtime/stock_finder_bridge.py"
      - "hybrid_runtime/github_library.py"
      - "hybrid_runtime/router.py"
      - "test_desktop_stock_finder_bridge.py"

permissions:
  contents: write

concurrency:
  group: codex-apply-stock-finder-cloud-bridge
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/desktop-stock-finder-20260902
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # This workflow is temporary and self-removes only after the guarded
      # transformation and focused bridge regressions pass on the current head.
      - name: Apply guarded bridge transformation
        run: python .codex/apply_stock_finder_cloud_bridge.py

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-desktop.txt
          python -m pip install "pytest>=8,<9"

      - name: Run cloud bridge regressions
        run: |
          python -m pytest -q \
            test_desktop_stock_finder_bridge.py \
            test_hybrid_cloud_bridge.py \
            test_hybrid_runtime.py \
            test_hybrid_runtime_hardening.py
          python -m py_compile \
            hybrid_runtime/cloud_bridge.py \
            hybrid_runtime/stock_finder_bridge.py \
            hybrid_runtime/github_library.py
          git diff --check

      - name: Commit applied bridge and remove temporary applicator
        shell: bash
        run: |
          set -euo pipefail
          rm -f .codex/apply_stock_finder_cloud_bridge.py
          rmdir .codex 2>/dev/null || true
          rm -f .github/workflows/codex-apply-stock-finder-cloud-bridge.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Attach desktop Stock Finder to distributed cloud queue"
          git push origin HEAD:codex/desktop-stock-finder-20260902
