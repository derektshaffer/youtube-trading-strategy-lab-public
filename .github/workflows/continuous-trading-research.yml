name: Continuous Trading Research

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: continuous-trading-research
  cancel-in-progress: false

jobs:
  research-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_PAID_API_KEY: ${{ secrets.GEMINI_PAID_API_KEY }}
      GEMINI_RESEARCH_BULK_MODEL: ${{ vars.GEMINI_RESEARCH_BULK_MODEL || 'gemini-3.7-flash' }}
      GEMINI_RESEARCH_SPECIALIST_MODEL: ${{ vars.GEMINI_RESEARCH_SPECIALIST_MODEL || 'gemini-3.1-pro-preview' }}
      GITHUB_BACKUP_REPOSITORY: ${{ secrets.TRADING_LAB_BACKUP_REPOSITORY }}
      GITHUB_BACKUP_TOKEN: ${{ secrets.TRADING_LAB_BACKUP_TOKEN }}
      GITHUB_BACKUP_BRANCH: ${{ vars.GITHUB_BACKUP_BRANCH }}
      GITHUB_BACKUP_PATH: ${{ vars.TRADING_INTELLIGENCE_BACKUP_PATH || 'trading-intelligence-lab/intelligence_library.json' }}
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_LIVE_FEED: ${{ vars.ALPACA_LIVE_FEED || 'iex' }}
      ALPACA_HISTORICAL_FEED: ${{ vars.ALPACA_HISTORICAL_FEED || 'sip' }}
      RESEARCH_JOBS_PER_RUN: ${{ vars.RESEARCH_JOBS_PER_RUN || '4' }}
      RESEARCH_TOPICS_PER_CYCLE: ${{ vars.RESEARCH_TOPICS_PER_CYCLE || '10' }}
      RESEARCH_VALIDATION_BATCH_SIZE: ${{ vars.RESEARCH_VALIDATION_BATCH_SIZE || '3' }}
      RESEARCH_VALIDATION_UNIVERSE_SIZE: ${{ vars.RESEARCH_VALIDATION_UNIVERSE_SIZE || '250' }}
      RESEARCH_PARALLEL_WORKERS: ${{ vars.RESEARCH_PARALLEL_WORKERS || '4' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate required worker secrets
        shell: bash
        run: |
          missing=0
          for name in GEMINI_API_KEY GITHUB_BACKUP_REPOSITORY GITHUB_BACKUP_TOKEN ALPACA_API_KEY ALPACA_SECRET_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required Actions secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Run persistent autonomous research worker
        run: python cloud_research_worker.py
