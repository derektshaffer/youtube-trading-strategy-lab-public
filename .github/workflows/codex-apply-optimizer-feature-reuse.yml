name: Apply optimizer feature reuse

on:
  push:
    branches:
      - codex/optimizer-feature-reuse-20260902
    paths:
      - ".codex/apply_optimizer_feature_reuse.py"
      - ".github/workflows/codex-apply-optimizer-feature-reuse.yml"
      - "test_optimizer_feature_reuse.py"

permissions:
  contents: write

concurrency:
  group: codex-apply-optimizer-feature-reuse
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/optimizer-feature-reuse-20260902
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Apply guarded source transformation
        run: python .codex/apply_optimizer_feature_reuse.py

      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "pytest>=8,<9"

      - name: Run optimizer and engine regressions
        run: |
          python -m pytest -q test_optimizer_feature_reuse.py test_youtube_strategy_engine.py
          python -m py_compile youtube_strategy_engine.py
          git diff --check

      - name: Commit applied source and remove temporary applicator
        shell: bash
        run: |
          set -euo pipefail
          rm -f .codex/apply_optimizer_feature_reuse.py
          rmdir .codex 2>/dev/null || true
          rm -f .github/workflows/codex-apply-optimizer-feature-reuse.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Reuse prepared optimizer features and row payloads"
          git push origin HEAD:codex/optimizer-feature-reuse-20260902
