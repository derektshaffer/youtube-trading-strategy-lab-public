<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trading Intelligence — Tauri spike</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #eef6ff; background: #07101c; }
    body { margin: 0; padding: 28px; }
    .card { background: #111d2d; border: 1px solid #2d415d; border-radius: 16px; padding: 22px; max-width: 900px; }
    button { border: 0; border-radius: 10px; padding: 11px 16px; font-weight: 750; cursor: pointer; }
    progress { width: 100%; height: 18px; margin: 16px 0; }
    pre { white-space: pre-wrap; color: #a9bdd1; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Trading Intelligence</h1>
    <p id="service">Starting local service…</p>
    <p id="route">No route selected.</p>
    <progress id="progress" max="1" value="0"></progress>
    <button id="run">Run local health job</button>
    <pre id="details"></pre>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
