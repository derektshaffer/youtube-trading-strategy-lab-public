[package]
name = "trading-intelligence-tauri-spike"
version = "0.1.0"
description = "Trading Intelligence desktop framework spike"
authors = ["Trading Intelligence Lab"]
edition = "2021"

[lib]
name = "trading_intelligence_tauri_spike_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
